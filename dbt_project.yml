# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models.

name: 'Capstone_23695_AA'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# Project paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"


# ============================================================
# MODEL CONFIGURATION
# ============================================================

models:

  Capstone_23695_AA:

    # --------------------------------------------------------
    # BRONZE / STAGING
    # --------------------------------------------------------

    staging:

      bronze:
        +schema: "{{ env_var('DBT_BRONZE_SCHEMA') }}"


    # --------------------------------------------------------
    # SILVER
    # --------------------------------------------------------

    silver:
      +schema: "{{ env_var('DBT_SILVER_SCHEMA') }}"


    # --------------------------------------------------------
    # GOLD
    #
    # Everything inside marts belongs to GOLD.
    #
    # This includes:
    #   - Dimensions
    #   - Facts
    #   - Reporting views
    #
    # Therefore there is NO separate reporting schema.
    # --------------------------------------------------------

    marts:
      +schema: "{{ env_var('DBT_GOLD_SCHEMA') }}"


  # ----------------------------------------------------------
  # ELEMENTARY
  # ----------------------------------------------------------

  elementary:
    +schema: elementary